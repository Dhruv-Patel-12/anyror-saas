[project]
name = "anyror-saas-backend"
version = "0.1.0"
description = "Production Land Intelligence Engine for AnyROR Gujarat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "playwright>=1.47.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "pillow>=10.4.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.26.0",
    "google-genai>=0.1.1",
    "structlog>=24.4.0",
    "alembic>=1.13.3",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"