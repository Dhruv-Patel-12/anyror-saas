<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120">
  <defs>
    <style>
      .wordmark { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; letter-spacing: -0.5px; }
      .tagline { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; letter-spacing: 2px; }
    </style>
  </defs>
  <!-- Icon Mark (Reversed) -->
  <g transform="translate(10, 10) scale(1)">
    <line x1="4" y1="50" x2="52" y2="50" stroke="#F8F0E5" stroke-width="4" stroke-linecap="round"/>
    <line x1="10" y1="20" x2="52" y2="50" stroke="#F8F0E5" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="10" y1="80" x2="52" y2="50" stroke="#F8F0E5" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="4" cy="50" r="4" fill="#0F2C59" stroke="#F8F0E5" stroke-width="2"/>
    <circle cx="10" cy="20" r="3.6" fill="#0F2C59" stroke="#F8F0E5" stroke-width="1.8"/>
    <circle cx="10" cy="80" r="3.6" fill="#0F2C59" stroke="#F8F0E5" stroke-width="1.8"/>
    <polygon points="52,50 60,63.9 76,63.9 84,50 76,36.1 60,36.1" fill="#F8F0E5"/>
    <line x1="60" y1="36.1" x2="76" y2="36.1" stroke="#DAC0A3" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <!-- Text Lockup -->
  <text x="110" y="65" class="wordmark" font-size="40" fill="#F8F0E5">TitleNode</text>
  <text x="112" y="86" class="tagline" font-size="9" fill="#DAC0A3">THE INTELLIGENCE LAYER FOR LAND</text>
</svg>
